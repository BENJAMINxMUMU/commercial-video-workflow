<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业视频工作流 · 工作台入口</title>
<style>
  :root{--bg:#f4f6fb;--panel:#fff;--ink:#1f2733;--muted:#6b7686;--accent:#3b6cff;--accent-soft:#e8efff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #e9efff, var(--bg)); color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:32px}
  .wrap{width:100%; max-width:760px}
  .head{text-align:center; margin-bottom:28px}
  .head h1{font-size:26px; margin:0 0 8px}
  .head p{color:var(--muted); margin:0; font-size:14px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .card{background:var(--panel); border:1px solid #dde3ee; border-radius:16px; padding:22px;
    text-decoration:none; color:inherit; box-shadow:0 6px 20px rgba(31,39,51,.08); transition:.18s; display:block}
  .card:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 12px 28px rgba(31,39,51,.14)}
  .card .ic{font-size:30px}
  .card h2{margin:12px 0 6px; font-size:17px}
  .card p{margin:0; color:var(--muted); font-size:13px; line-height:1.5}
  .card .go{margin-top:14px; color:var(--accent); font-weight:600; font-size:13px}
  .foot{text-align:center; margin-top:26px; color:var(--muted); font-size:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>商业视频工作流</h1>
      <p>全流程制作工作台 · 固定域名入口</p>
    </div>
    <div class="grid">
      <a class="card" href="workbench.html">
        <div class="ic">🎬</div>
        <h2>制作工作台</h2>
        <p>需求提炼 → 创意策划 → 脚本 → 分镜 → 提报的完整 9 环节流程引擎，含项目库与自动存档。</p>
        <div class="go">打开工作台 →</div>
      </a>
      <a class="card" href="workflow-canvas.html">
        <div class="ic">🧩</div>
        <h2>工作流画布</h2>
        <p>可视化节点流程图，自由增删 / 拖拽 / 排序工作流步骤，支持导出导入 JSON。</p>
        <div class="go">打开画布 →</div>
      </a>
    </div>
    <div class="foot">由 Render 静态站点托管 · 仓库 commercial-video-workflow</div>
  </div>
</body>
</html>
