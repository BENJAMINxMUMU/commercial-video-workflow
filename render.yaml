# Render 静态站点配置
# 部署方式：在 Render 后台 New → Static Site → 连接 GitHub 仓库
# commercial-video-workflow → 选择本文件自动识别 → 部署
# 部署完成后获得固定域名：https://<name>.onrender.com
services:
  - type: web
    name: commercial-video-workflow
    runtime: static
    buildCommand: ""
    staticPublishPath: ./standalone
    pullRequestPreviews: false
    # 如需绑定自定义域名，在 Render 后台 Static Site → Settings → Custom Domains 添加，
    # 并按提示配置 DNS（CNAME 到 <name>.onrender.com）。
