# Render 静态站点配置
# 部署方式：在 Render 后台 New → Static Site → 连接 GitHub 仓库
# commercial-video-workflow → 选择本文件自动识别 → 部署
# 部署完成后获得固定域名：https://<name>.onrender.com
services:
  - type: web
    name: commercial-video-workflow
    runtime: static
    buildCommand: ""
    staticPublishPath: ./standalone
    pullRequestPreviews: false
    # 如需绑定自定义域名，在 Render 后台 Static Site → Settings → Custom Domains 添加，
    # 并按提示配置 DNS（CNAME 到 <name>.onrender.com）。

  # 工作流变更通知服务（后端接收 + 实时变更流）
  - type: web
    name: commercial-video-workflow-notify
    runtime: node
    buildCommand: ""
    startCommand: "node server.js"
    plan: free
    healthCheckPath: /
    # 部署后获得固定域名：https://commercial-video-workflow-notify.onrender.com
    # 通知接收：POST https://commercial-video-workflow-notify.onrender.com/api/notify
    # 变更流看板：https://commercial-video-workflow-notify.onrender.com/notify
